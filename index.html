<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="description" content="RFP S-3 BASINLINK & BASINCAST: System Definition Review: research, design and trades for the Congo River Basin system of systems." />
  <title>S-3 BASINLINK SDR</title>
  <script>/* theme before first paint: the saved choice, else the system setting (see src/style.css) */
    try { var t = localStorage.getItem('srr-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230A0A0A' stroke='%23CFB991' stroke-width='2'/%3E%3Cpath d='M7 20.5c3-1 3.6-5.2 7-6.2s4.8 2.4 7.6 1.3c2-.8 2.6-3.1 3.4-4.6' fill='none' stroke='%237FCBEA' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <button class="skip" data-act="skip">Skip to content</button>
  <div id="app" data-view="research">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" id="brand-mark"></span>
        <div class="brand-text">
          <span class="brand-kicker">Congo River Basin · SDR · RFP S-3</span>
          <span class="brand-title">BASINLINK &amp; BASINCAST</span>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="View">
        <span class="tabs-ink"></span>
        <button role="tab" id="tab-research" data-view="research" aria-controls="view-conops">Research</button>
        <button role="tab" id="tab-design" data-view="design" aria-controls="view-conops">Design</button>
        <button role="tab" id="tab-trades" data-view="trades" aria-controls="view-sdr">Trades</button>
      </nav>
      <div class="top-right">
        <button class="offline" data-act="preload" data-state="loading" aria-live="polite"><i aria-hidden="true"></i><span>Loading…</span></button>
        <a class="top-link" href="https://corrigk.github.io/congo-srr-requirements/" target="_blank" rel="noopener" title="The team's requirements site (opens in a new tab)">Requirements<span aria-hidden="true"> ↗</span><span class="sr-only"> (opens in a new tab)</span></a>
        <span class="divider"></span>
        <button class="icon-btn" data-act="sources" title="Sources (S)" aria-label="Sources" aria-expanded="false" aria-controls="panel"></button>
        <button class="icon-btn" data-act="theme" title="Light / dark (L)" aria-label="Switch to light theme"></button>
        <button class="icon-btn" data-act="present" title="Presenter mode (P)" aria-label="Presenter mode" aria-pressed="false"></button>
        <button class="icon-btn" data-act="fullscreen" title="Fullscreen (F)" aria-label="Fullscreen"></button>
        <button class="icon-btn" data-act="help" title="Shortcuts (?)" aria-label="Keyboard shortcuts"></button>
      </div>
    </header>

    <section class="process-view co-view" id="view-conops" role="tabpanel" aria-labelledby="tab-research"></section>
    <section class="process-view cv-view" id="view-coverage" role="tabpanel" aria-labelledby="tab-design" hidden></section>
    <section class="process-view sd-view" id="view-sdr" role="tabpanel" aria-labelledby="tab-trades" hidden></section>

    <aside class="panel glass" id="panel" aria-label="Details"></aside>
    <button class="slide-exit" data-act="slide" hidden>Show the top bar (H)</button>
    <div class="sr-only" id="announce" aria-live="polite"></div>
    <div class="help glass" id="help" role="dialog" aria-label="Keyboard shortcuts" hidden></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
